name: Issue Close Check

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  issue-close-remove-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Remove labels
        if: ${{ !github.event.issue.pull_request }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request DELETE \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/labels/%E7%8A%B6%E6%80%81%3A%E5%BE%85%E5%A4%84%E7%90%86")
          case "$status" in
            200|404) ;;
            *) echo "Failed to remove label (HTTP $status)" >&2; exit 1 ;;
          esac
